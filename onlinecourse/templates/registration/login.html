{% extends 'onlinecourse/base.html' %}
{% block title %}Log in{% endblock %}
{% block content %}
  <h1 class="h2">Log in</h1>
  {% if form.errors %}<div class="alert alert-danger">The username or password was not recognized.</div>{% endif %}
  <form method="post" class="mt-3" style="max-width: 28rem">
    {% csrf_token %}
    <input type="hidden" name="next" value="{{ next }}">
    <div class="mb-3"><label class="form-label" for="id_username">Username</label>{{ form.username }}</div>
    <div class="mb-3"><label class="form-label" for="id_password">Password</label>{{ form.password }}</div>
    <button class="btn btn-primary" type="submit">Log in</button>
  </form>
{% endblock %}
